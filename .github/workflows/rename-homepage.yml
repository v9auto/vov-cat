name: rename-homepage
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename homepage file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv lao-liu-de-jia-vov-cat.html index.html
          git commit -m "Rename lao-liu-de-jia-vov-cat.html to index.html"
          git push
